app = 'review-star-api'
primary_region = 'nrt'

[build]
[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = "shared"
  cpus = 1
